name: Test PR

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No code scanning upload, so findings become annotations and fail the job.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Pinned, so a new audit cannot start failing releases with nothing changed here.
          version: "1.32.0"
          advanced-security: false
          annotations: true

  tests:
    name: Run Foundry tests
    needs: [zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.9.0

      - name: Install dependencies
        run: forge install

      - name: Compile contracts
        run: forge build

      - name: Run unit tests
        run: forge test --mt test_U
        timeout-minutes: 10

      - name: Run integration tests
        run: forge test --mt test_I
        timeout-minutes: 10

      - name: Run gas tests
        run: forge test --mt test_G -vv
